<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PureGym — Streak goal</title>

    <link rel="stylesheet" href="app.css">
</head>

<body>

    <!-- Figma "StreakTweak".  An orphan frame in the prototype; reached here
         from the settings gear on the home screen. -->
    <div class="device">
        <div class="screen">

            <header class="header">
                <a class="back" href="index.html" aria-label="Go back">
                    <svg viewBox="0 0 30 30" fill="none" aria-hidden="true">
                        <path d="M25 15H6M6 15l7-7M6 15l7 7" stroke="currentColor"
                              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </a>
                <img class="logo" src="assets/logo.png" alt="PureGym">
            </header>

            <main class="goal-main">

                <div class="goal-sentence">
                    <span class="goal-line">I want to work out</span>
                    <span class="goal-line">
                        <span class="goal-select">
                            <svg class="chevron" viewBox="0 0 14 8" fill="none" aria-hidden="true">
                                <path d="M1 1.5l6 5 6-5" stroke="currentColor"
                                      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <select aria-label="Workouts per week">
                                <option>1</option>
                                <option selected>2</option>
                                <option>3</option>
                                <option>4</option>
                                <option>5</option>
                                <option>6</option>
                                <option>7</option>
                            </select>
                        </span>
                        times a week
                    </span>
                </div>

                <a class="goal-confirm" href="streak-0.html" aria-label="Confirm">
                    <svg viewBox="0 0 22 22" fill="none" aria-hidden="true">
                        <path d="M4 11.5l5 5 9-11" stroke="currentColor"
                              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </a>

            </main>

        </div>
    </div>

</body>

</html>
