<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PureGym — Streak</title>

    <link rel="stylesheet" href="app.css">
</head>

<body>

    <!-- Figma 14:1716 — MidStreak.  Tap the circle -> 14:1853 -->
    <div class="device">
        <div class="screen">

            <header class="header">
                <a class="back" href="index.html" aria-label="Go back">
                    <svg viewBox="0 0 30 30" fill="none" aria-hidden="true">
                        <path d="M25 15H6M6 15l7-7M6 15l7 7" stroke="currentColor"
                              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </a>
                <img class="logo" src="assets/logo.png" alt="PureGym">
            </header>

            <main class="streak-main">

                <div class="week">
                    <div class="week-label">week 1</div>
                    <div class="week-strip">
                        <div class="week-day">mo</div>
                        <div class="week-day">tu</div>
                        <div class="week-day">we</div>
                        <div class="week-day is-teal">th</div>
                        <div class="week-day is-teal">fr</div>
                        <div class="week-day is-pink">sa</div>
                        <div class="week-day">su</div>
                    </div>
                </div>

                <div class="counter is-gradient">
                    <!-- transparent hotspot: advances to the next streak state -->
                    <a class="counter-hit" href="streak-2.html" aria-label="Next streak state"></a>

                    <div class="counter-value">0</div>
                    <div class="counter-unit">weeks</div>
                    <div class="counter-goal">
                        current streak goal:
                        <span class="goal-value">
                            <a class="goal-gear" href="goal.html" aria-label="Change streak goal">
                                <span class="icon icon-gear"></span>
                            </a>2/week
                        </span>
                    </div>
                </div>

                <div class="calendar">
                    <div class="cal-nav cal-prev">
                        <svg viewBox="0 0 15 12" fill="none" aria-hidden="true">
                            <path d="M14 6H1M1 6l4-4M1 6l4 4" stroke="currentColor"
                                  stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="cal-month">January</div>
                    <div class="cal-nav cal-next">
                        <svg viewBox="0 0 15 12" fill="none" aria-hidden="true">
                            <path d="M1 6h13M14 6l-4-4M14 6l-4 4" stroke="currentColor"
                                  stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>

                    <div class="cal-weekday">mo</div>
                    <div class="cal-weekday">tu</div>
                    <div class="cal-weekday">we</div>
                    <div class="cal-weekday">th</div>
                    <div class="cal-weekday">fr</div>
                    <div class="cal-weekday">sa</div>
                    <div class="cal-weekday">su</div>

                    <!-- January starts on a Thursday, so three blanks first -->
                    <div class="cal-day is-empty"></div>
                    <div class="cal-day is-empty"></div>
                    <div class="cal-day is-empty"></div>

                    <div class="cal-day is-teal">1</div>
                    <div class="cal-day is-teal">2</div>
                    <div class="cal-day is-pink">3</div>
                    <div class="cal-day">4</div>
                    <div class="cal-day">5</div>
                    <div class="cal-day">6</div>
                    <div class="cal-day">7</div>
                    <div class="cal-day">8</div>
                    <div class="cal-day">9</div>
                    <div class="cal-day">10</div>
                    <div class="cal-day">11</div>
                    <div class="cal-day">12</div>
                    <div class="cal-day">13</div>
                    <div class="cal-day">14</div>
                    <div class="cal-day">15</div>
                    <div class="cal-day">16</div>
                    <div class="cal-day">17</div>
                    <div class="cal-day">18</div>
                    <div class="cal-day">19</div>
                    <div class="cal-day">20</div>
                    <div class="cal-day">21</div>
                    <div class="cal-day">22</div>
                    <div class="cal-day">23</div>
                    <div class="cal-day">24</div>
                    <div class="cal-day">25</div>
                    <div class="cal-day">26</div>
                    <div class="cal-day">27</div>
                    <div class="cal-day">28</div>
                    <div class="cal-day">29</div>
                    <div class="cal-day">30</div>
                    <div class="cal-day">31</div>
                </div>

            </main>

        </div>
    </div>

</body>

</html>
